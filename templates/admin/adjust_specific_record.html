{% extends "base_admin.html" %}
{% block content %}
    <p><a href="/admin/">&larr; Back to Admin Navigation</a></p>
    <p><a href="/admin/data_adjustments">&larr; Back to All Match Data</a></p>
    <form action="/admin/adjust_data" method="POST" onsubmit="return validate()">
        <input type="hidden" name="original_match_record_id" value="{{original_record_id}}" required>
        <input type="hidden" name="event_id" value="{{match_data.event_id}}" required>
        <label for="match_number">Match Number</label>
        <input class="textBox" type="text" id="match_number" name="match_number" value="{{match_data.match_number}}" size="15" required>
        <label for="team_number">Team Number</label>
        <input class="textBox" type="text" id="team_number" name="team_number" value="{{match_data.team_number}}" size="15" required>
        <br /><hr />

        <!-- AUTO -->
        <h3>Autonomous</h3>
        <label for="auto_fuel_score">Fuel scored</label>
        <input class="numbox" type="number" id="auto_fuel_score" name="auto_fuel_score" value="{{match_data.auto_fuel_score}}" min="0" required>
        <br />
        <br />
        <label for="auto_climb_try">Tried to Climb?</label>
        <input class="textBox" type="text" id="auto_climb_try" name="auto_climb_try" value="{{match_data.auto_climb_try}}">
        <br />
        <br />
        <label for="auto_traveled">Auto Traveled?</label>
        <input class="textBox" type="text" id="auto_traveled" name="auto_traveled" value="{{match_data.auto_traveled}}">
        </select>
        <br />

        <h3>Teleop</h3>
        <label for="teleop_fuel_score">Fuel scored</label>
        <input class="numbox" type="number" id="teleop_fuel_score" name="teleop_fuel_score" value="{{match_data.teleop_fuel_score}}" min="0" required>
        <br />
        <br />

        <label for="teleop_traveled">Teleop Traveled?</label>
        <input class="textBox" type="text" id="teleop_traveled" name="teleop_traveled" value="{{match_data.teleop_traveled}}">
        <br />

        <h3>Endgame</h3>
        <label for="endgame_climb_try">Tried to Climb?</label>
        <input class="textBox" type="text" id="endgame_climb_try" name="endgame_climb_try" value="{{match_data.endgame_climb_try}}">
        <br />

        <h3>Strategies</h3>

        <h4>Active Periods</h4>
        <input type="checkbox" id="active_scored" name="active_scored" {% if match_data.strategy_active_scored %}checked{% endif %}>
        <label for="active_scored">Scored Fuel?</label>
        <br />
        <input type="checkbox" id="active_ferrying" name="active_ferrying" {% if match_data.strategy_active_ferrying %}checked{% endif %}>
        <label for="active_ferrying">Ferried Fuel?</label>
        <br />
        <input type="checkbox" id="active_defense" name="active_defense" {% if match_data.strategy_active_defense %}checked{% endif %}>
        <label for="active_defense">Played defense?</label>
        <br />

        <h4>Inactive Periods</h4>
        <input type="checkbox" id="inactive_scored" name="inactive_scored" {% if match_data.strategy_inactive_scored %}checked{% endif %}>
        <label for="inactive_scored">Scored Fuel?</label>
        <br />
        <input type="checkbox" id="inactive_ferrying" name="inactive_ferrying" {% if match_data.strategy_inactive_ferrying %}checked{% endif %}>
        <label for="inactive_ferrying">Ferried Fuel?</label>
        <br />
        <input type="checkbox" id="inactive_defense" name="inactive_defense" {% if match_data.strategy_inactive_defense %}checked{% endif %}>
        <label for="inactive_defense">Played defense?</label>
        <br />
        <br />
        <label for="strat_defense">Defensive Actions</label>
        <input class="numbox" type="number" id="strat_defense" name="strat_defense" value="{{match_data.strategy_defense_actions}}" min="0" required>

        <h4>Robot Issues</h4>

        <input type="checkbox" id="tipped" name="tipped" {% if match_data.match_tipped %}checked{% endif %}>
        <label for="tipped">Tipped?</label>
        <br />
        <input type="checkbox" id="broken" name="broken" {% if match_data.match_broken %}checked{% endif %}>
        <label for="broken">Broken?</label>
        <br />
        <input type="checkbox" id="beached" name="beached" {% if match_data.match_beached %}checked{% endif %}>
        <label for="beached">Got stuck on Fuel?</label>
        <br />
        <input type="checkbox" id="carded" name="carded" {% if match_data.match_carded %}checked{% endif %}>
        <label for="carded">Red or Yellow Card?</label>
        <br />
        <input type="checkbox" id="disabled" name="disabled" {% if match_data.match_disabled %}checked{% endif %}>
        <label for="disabled">Disabled? (A-Stop or E-Stop)</label>
        <br />
        <input type="checkbox" id="absent" name="absent" {% if match_data.match_absent %}checked{% endif %}>
        <label for="absent">Absent from Field?</label>
        <br />

        <hr />

        all good? <input class="send" type="submit" value="SUBMIT"> your data!
    </form>
{% endblock %}
